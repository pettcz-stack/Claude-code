[project]
name = "efektivni-manazer-api"
version = "0.1.0"
description = "API a worker pro Efektivního manažera"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "anthropic>=0.40",
    "imap-tools>=1.7",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "tzdata>=2024.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
