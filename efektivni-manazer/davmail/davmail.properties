# ===========================================================================
# davmail konfigurace pro Office 365 Modern Auth (OAuth)
#
# Token se uloží do /home/davmail/.davmail/token.json (persistent volume),
# takže prvním přihlášením přes browser jsi hotov – další starty už token
# obnovují automaticky.
# ===========================================================================

# Server mode (bez GUI)
davmail.server=true
davmail.disableUpdateCheck=true
davmail.allowRemote=true
davmail.bindAddress=0.0.0.0

# Exchange / O365 endpoint
davmail.url=https://outlook.office365.com/EWS/Exchange.asmx
davmail.mode=O365Manual

# Naslouchat jen na IMAP + SMTP (Caldav/LDAP nepotřebujeme)
davmail.imapPort=1143
davmail.smtpPort=1025
davmail.caldavPort=
davmail.ldapPort=
davmail.popPort=

# OAuth: ulož token na disk, aby přežil restart kontejneru
davmail.oauth.persistToken=true
davmail.oauth.tokenFilePath=/home/davmail/.davmail/token.json

# Logging
log4j.logger.davmail=INFO
log4j.logger.httpclient.wire=WARN
log4j.rootLogger=WARN
