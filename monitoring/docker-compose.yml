# FOCUS – on-premise nasazení (PostgreSQL + backend + frontend).
# Spuštění:  docker compose up -d --build
# Dashboard: http://localhost:8080   (přihlášení: ADMIN_USER / ADMIN_PASSWORD)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-focus}
      POSTGRES_DB: focus
    volumes:
      - focus-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focus']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://focus:${DB_PASSWORD:-focus}@db:5432/focus?schema=public
      PORT: 4000
      INGEST_TOKEN: ${INGEST_TOKEN:-zmente-me}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-zmente-me}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-35}
      HOURLY_RETENTION_DAYS: ${HOURLY_RETENTION_DAYS:-540}
      # E-mailové reporty (volitelné):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-focus@firma.cz}
      REPORT_RECIPIENTS: ${REPORT_RECIPIENTS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  focus-db:
