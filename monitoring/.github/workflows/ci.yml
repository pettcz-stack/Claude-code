name: CI

# Typecheck, build a otestuje monitoring app (backend + frontend) na Linuxu.
# Windows agent/MSI se staví zvlášť v monitoring-agent-build.yml.
on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./ci.db
      INGEST_TOKEN: ci-test-token
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-test-password
      PORT: 8099
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations (fresh DB)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Architecture check (no AI/LLM API integrations)
        run: npm run lint:no-ai

      - name: Typecheck + build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Smoke-boot server and probe health
        run: |
          npm start &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${PORT}/api/v1/health"; then break; fi
            sleep 1
          done
          echo
          curl -fsS "http://localhost:${PORT}/api/v1/health" | grep -q '"status":"ok"'
          kill $PID

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Architecture check (no AI/LLM API integrations)
        run: npm run lint:no-ai

      - name: Typecheck + build
        run: npm run build
