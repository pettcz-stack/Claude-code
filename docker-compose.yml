services:
  app:
    build: .
    image: albixon-moderator:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
    env_file:
      - .env
    volumes:
      - moderator-data:/data

volumes:
  moderator-data:
