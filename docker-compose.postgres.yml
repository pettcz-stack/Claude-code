services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moderator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: moderator
    volumes:
      - moderator-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderator"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: albixon-moderator:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://moderator:${POSTGRES_PASSWORD:-change-me}@db:5432/moderator?schema=public
    env_file:
      - .env

volumes:
  moderator-pg:
