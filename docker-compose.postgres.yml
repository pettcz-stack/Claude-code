services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viktor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: viktor
    volumes:
      - viktor-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viktor"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: viktor-cistic:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://viktor:${POSTGRES_PASSWORD:-change-me}@db:5432/viktor?schema=public
    env_file:
      - .env

volumes:
  viktor-pg:
