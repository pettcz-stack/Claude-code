name: Monitoring Agent (Windows build)

# Sestaví Windows agenta, watchdog službu a MSI instalátor na skutečném
# Windows runneru a vystaví hotové artefakty ke stažení.
# Spouští se při změně Windows částí nebo ručně (workflow_dispatch).

on:
  push:
    branches: ["**"]
    paths:
      - "monitoring/agent/**"
      - "monitoring/installer/**"
      - ".github/workflows/monitoring-agent-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build agent (net48)
        run: dotnet build "monitoring/agent/WorkView.Agent/WorkView.Agent.csproj" -c Release

      - name: Build watchdog service (net48)
        run: dotnet build "monitoring/agent/WorkView.Watchdog/WorkView.Watchdog.csproj" -c Release

      - name: Install WiX toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        working-directory: monitoring/installer
        shell: pwsh
        run: |
          wix build Product.wxs -ext WixToolset.Util.wixext `
            -d "AgentExePath=..\agent\WorkView.Agent\bin\Release\net48\MA win 32.exe" `
            -d "WatchdogExePath=..\agent\WorkView.Watchdog\bin\Release\net48\MA win 32 Service.exe" `
            -o FocusAgent.msi

      - name: Stage install package (MSI + click-to-install .bat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item monitoring/installer/FocusAgent.msi                    artifact/
          # Frontend názvy pro uživatele: prostě klikni "Instalovat"
          Copy-Item monitoring/installer/install-agent-test.bat            'artifact/Instalovat FOCUS agenta.bat'
          Copy-Item monitoring/installer/uninstall-agent-test.bat          'artifact/Odinstalovat FOCUS agenta.bat'
          # README úplně nahoře (Windows řadí abecedně, "0_" ho dá první)
          @"
          FOCUS Agent - instalace v 1 kroku
          =================================

          1) Mit Docker server bezici (monitoring\start-demo.bat na serveru).

          2) DVOJKLIKEM na "Instalovat FOCUS agenta.bat".
             - Sam si rekne o UAC (klikni Ano).
             - Sam si najde FocusAgent.msi vedle.
             - Sam overi, ze backend bezi.
             - Sam doinstaluje a spusti sluzbu.

          3) V dashboardu (http://localhost:8080) -> Sprava -> Zarizeni
             se PC objevi do ~5 minut.

          Defaultne miri na http://localhost:8080 (token "dev-token").
          Kdyz je server jinde, otevri ".bat" v Poznamkovem bloku a
          uprav prvni "set BACKENDURL=..." radek.

          Odinstalace: dvojklik na "Odinstalovat FOCUS agenta.bat".
          "@ | Set-Content -Path 'artifact/0_PRECTI MNE.txt' -Encoding UTF8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-windows-build
          path: artifact/**
          if-no-files-found: error
