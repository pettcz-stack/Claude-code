name: Monitoring Docker (build validation)

# Postaví všechny 3 Docker images (demo all-in-one, prod backend, prod frontend)
# na každý push, který se týká monitoring/ a Dockerfilů. Bez push do registru –
# jen smoke-test, že image se sestaví bez chyby. Po úspěšném buildu spustí
# demo image a ověří, že healthcheck endpoint odpovídá.

on:
  push:
    branches: ["**"]
    paths:
      - "monitoring/Dockerfile*"
      - "monitoring/docker-compose*.yml"
      - "monitoring/backend/Dockerfile"
      - "monitoring/backend/docker-entrypoint.sh"
      - "monitoring/backend/package*.json"
      - "monitoring/backend/prisma/**"
      - "monitoring/backend/src/**"
      - "monitoring/backend/scripts/**"
      - "monitoring/backend/tsconfig.json"
      - "monitoring/frontend/Dockerfile"
      - "monitoring/frontend/nginx.conf"
      - "monitoring/frontend/package*.json"
      - "monitoring/frontend/src/**"
      - "monitoring/frontend/vite.config.ts"
      - ".github/workflows/monitoring-docker.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "monitoring/**"
      - ".github/workflows/monitoring-docker.yml"

jobs:
  build-demo:
    name: Demo image (all-in-one)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo image
        uses: docker/build-push-action@v6
        with:
          context: monitoring
          file: monitoring/Dockerfile.demo
          push: false
          load: true
          tags: focus-demo:ci
          cache-from: type=gha,scope=focus-demo
          cache-to: type=gha,mode=max,scope=focus-demo

      - name: Smoke-test demo image
        run: |
          docker run -d --name focus-demo -p 8080:8080 focus-demo:ci
          # Počkej až healthcheck zezelená (max 90 s na seed + start).
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' focus-demo 2>/dev/null || echo starting)
            if [ "$STATUS" = "healthy" ]; then
              echo "✓ demo image je healthy po ${i}×3 s"
              break
            fi
            sleep 3
          done
          # Final probe (pokud healthy timeout vypršel, dej user-friendly chybu).
          if ! curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"ok"'; then
            echo "::error::Demo image neodpovídá na /api/v1/health"
            docker logs focus-demo | tail -50
            exit 1
          fi
          # Statika frontendu (index.html)
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"' || (echo "::error::Frontend není servírován" && exit 1)
          # Prometheus metriky
          curl -fsS http://localhost:8080/api/v1/metrics | grep -q 'focus_http_requests_total' || (echo "::error::/metrics nefunguje" && exit 1)
          docker stop focus-demo

  build-backend:
    name: Production backend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: monitoring/backend
          file: monitoring/backend/Dockerfile
          push: false
          load: false
          tags: focus-backend:ci
          cache-from: type=gha,scope=focus-backend
          cache-to: type=gha,mode=max,scope=focus-backend

  build-frontend:
    name: Production frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: monitoring/frontend
          file: monitoring/frontend/Dockerfile
          push: false
          load: false
          tags: focus-frontend:ci
          cache-from: type=gha,scope=focus-frontend
          cache-to: type=gha,mode=max,scope=focus-frontend
