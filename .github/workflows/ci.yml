name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: file:./dev.db
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DASHBOARD_USERNAME: admin
      DASHBOARD_PASSWORD: ci-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma client
        run: npm --workspace backend run prisma:generate

      - name: Run Prisma migrate
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Typecheck + build backend
        run: npm --workspace backend run build

      - name: Typecheck + build frontend
        run: npm --workspace frontend run build

      - name: Run tests
        run: npx --prefix backend vitest --dir backend/src run

      - name: Smoke-boot server and probe /health
        run: |
          node backend/dist/index.js &
          PID=$!
          sleep 3
          curl -fsS http://localhost:3000/health
          curl -fsS -u "$DASHBOARD_USERNAME:$DASHBOARD_PASSWORD" http://localhost:3000/api/comments | head -c 200
          kill $PID
        env:
          PORT: 3000

      - name: Doctor preflight (informational)
        run: npx tsx --tsconfig backend/tsconfig.json scripts/doctor.ts || true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - run: npm run format:check || true
