name: Monitoring CI

# Typecheck, build, lint, testy a license guard pro monitoring app
# (backend + frontend) na Linuxu. Windows agent/MSI staví zvlášť
# v monitoring-agent-build.yml. Docker images validuje monitoring-docker.yml.
on:
  push:
    branches: ["**"]
    paths:
      - "monitoring/backend/**"
      - "monitoring/frontend/**"
      - ".github/workflows/monitoring-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "monitoring/backend/**"
      - "monitoring/frontend/**"
      - ".github/workflows/monitoring-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring/backend
    env:
      DATABASE_URL: file:./ci.db
      INGEST_TOKEN: ci-test-token
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-test-password
      PORT: 8099
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monitoring/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations (fresh DB)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: License guard (no GPL/LGPL/AGPL drift)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes license-checker --production \
            --onlyAllow "MIT;MIT*;MIT-0;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;(MIT OR GPL-3.0-or-later);MIT AND Zlib;Custom: http://github.com/substack/node-bufferlist" \
            --excludePackages "focus-backend@$VERSION"

      - name: Smoke-boot server and probe health
        run: |
          npm start &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${PORT}/api/v1/health"; then break; fi
            sleep 1
          done
          echo
          curl -fsS "http://localhost:${PORT}/api/v1/health" | grep -q '"status":"ok"'
          kill $PID

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monitoring/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: License guard (no GPL/LGPL/AGPL drift)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes license-checker --production \
            --onlyAllow "MIT;MIT*;MIT-0;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;MIT AND ISC" \
            --excludePackages "focus-frontend@$VERSION"
